name: CI

on:
  push:
    branches:
      - main
      - 'v[0-9]*'
      - '!*-dev*'
      - '!*-beta*'

  pull_request:
    branches:
      - main
      - 'v[0-9]*'
      - '!*-dev*'
      - '!*-beta*'

jobs:

  PHP:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '^9.0',  testbench: '^7.0',  experimental: false }
          - { php: '8.2', laravel: '^10.0', testbench: '^8.0',  experimental: false }
          - { php: '8.2', laravel: '^11.0', testbench: '^9.0',  experimental: false }
          - { php: '8.2', laravel: '^12.0', testbench: '^10.0', experimental: false }
          - { php: '8.3', laravel: '^10.0', testbench: '^8.0',  experimental: false }
          - { php: '8.3', laravel: '^11.0', testbench: '^9.0',  experimental: false }
          - { php: '8.3', laravel: '^12.0', testbench: '^10.0', experimental: false }
          - { php: '8.3', laravel: '^13.0', testbench: '^11.0', experimental: false }
          - { php: '8.4', laravel: '^11.0', testbench: '^9.0',  experimental: false }
          - { php: '8.4', laravel: '^12.0', testbench: '^10.0', experimental: false }
          - { php: '8.4', laravel: '^13.0', testbench: '^11.0', experimental: false }
          - { php: '8.5', laravel: '^12.0', testbench: '^10.0', experimental: true  }
          - { php: '8.5', laravel: '^13.0', testbench: '^11.0', experimental: true  }
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Pin Laravel & Testbench
        run: >
          composer require --no-update --no-interaction
          "illuminate/console:${{ matrix.laravel }}"
          "illuminate/support:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --prefer-stable

      - name: Laravel Pint - Lint test
        run: composer test:lint

      - name: PHPStan - Static Analysis test
        run: composer test:types

      - name: Pest - Unit test
        run: composer test:unit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Lint
        working-directory: frontend
        run: npm run lint

      - name: Run Build
        working-directory: frontend
        run: npm run build
